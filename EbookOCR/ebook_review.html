<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전자책 OCR 교정</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --line:#d5d8de; --ink:#1d2330; --muted:#667085; --accent:#2f6fed;
          --low:#e5484d; --pic:#2f6fed; --ok:#2e9b5f;
          --md-h:#1f5fd1; --md-h2:#0e7c86; --md-h3:#6941c6; --md-mk:#98a2b3; --md-quote:#2e7d4f; --md-img:#8a3ffc; --md-b:#b25e09; --md-cm:#98a2b3;
          --md-q:rgba(229,72,77,.22); --md-sug:rgba(245,165,36,.22); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --panel:#1c2027; --line:#323844; --ink:#e6e9ef; --muted:#9aa3b2; --accent:#6a9bff;
            --md-h:#7aa7ff; --md-h2:#4fd1c5; --md-h3:#b8a4ff; --md-mk:#6b7487; --md-quote:#6fcf97; --md-img:#b99bff; --md-b:#f0a35e; --md-cm:#6b7487;
            --md-q:rgba(229,72,77,.3); --md-sug:rgba(245,165,36,.25); }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--ink);
         font:14px/1.5 "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; padding:8px 12px; background:var(--panel);
           border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0 8px 0 0; }
  button, input[type=text], input[type=number] { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line);
           border-radius:6px; padding:4px 10px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  input[type=number] { width:70px; }
  .sep { width:1px; align-self:stretch; background:var(--line); margin:0 4px; }
  .grow { flex:1; }
  #status { color:var(--muted); font-size:13px; min-width:90px; text-align:right; }
  #status.err { color:var(--low); }
  main { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:8px; }
  @media (max-width: 800px) { main { grid-template-columns:1fr; grid-template-rows:1fr 1fr; } }
  section { min-height:0; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:8px;
            display:flex; flex-direction:column; overflow:hidden; }
  .bar { display:flex; align-items:center; gap:6px; padding:6px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .bar span.t { font-weight:600; }
  #imgwrap { flex:1; overflow:auto; position:relative; background:var(--bg); }
  #stage { position:relative; margin:0 auto; line-height:0; }
  #stage img { width:100%; display:block; user-select:none; -webkit-user-drag:none; }
  #overlay { position:absolute; inset:0; }
  .rbox { position:absolute; border:1.5px solid rgba(47,111,237,.55); background:rgba(47,111,237,.07); cursor:pointer; }
  .rbox.low { border-color:var(--low); background:rgba(229,72,77,.18); }
  .rbox.cur { outline:3px solid #f5a524; outline-offset:1px; }
  .pbox { position:absolute; border:2px dashed var(--pic); background:rgba(47,111,237,.06); cursor:copy; }
  .pbox::after { content:"그림?"; position:absolute; left:0; top:0; font:11px/1 sans-serif; padding:2px 4px; background:var(--pic); color:#fff; }
  #sel { position:absolute; border:2px solid var(--ok); background:rgba(46,155,95,.18); pointer-events:none; }
  #imgwrap.crop #overlay { cursor:crosshair; }
  /* 글 칸: 투명한 입력칸(#editor) 뒤에 같은 글을 색칠한 층(#hl)을 깐다. 색만 바꾸고 굵기·크기는 그대로 두어 줄바꿈이 똑같다 */
  #edwrap { position:relative; flex:1; min-height:0; }
  #hl, #editor { position:absolute; inset:0; width:100%; height:100%; margin:0; border:0; padding:12px 14px;
            font:15px/1.7 "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
            white-space:pre-wrap; overflow-wrap:break-word; word-break:normal; tab-size:4; letter-spacing:normal;
            overflow-y:scroll; overflow-x:hidden; }
  #hl { color:var(--ink); background:var(--panel); pointer-events:none; }
  #editor { background:transparent; color:transparent; caret-color:var(--ink); resize:none; outline:none; }
  #editor::selection { background:rgba(47,111,237,.32); color:transparent; }
  #editor::placeholder { color:var(--muted); }
  #hl .m-mk { color:var(--md-mk); }
  #hl .m-h { color:var(--md-h); }
  #hl .m-h2 { color:var(--md-h2); }
  #hl .m-h3 { color:var(--md-h3); }
  #hl .m-i { color:var(--md-b); }
  #hl .m-u { color:var(--md-b); text-decoration:underline; }
  .fmt { display:flex; flex-wrap:wrap; gap:4px; align-items:center; padding:4px 10px; border-bottom:1px solid var(--line); }
  .fmt button { padding:2px 9px; font-size:13px; }
  .fmt .sep { margin:0 2px; }
  #hl .m-quote { color:var(--md-quote); }
  #hl .m-img { color:var(--md-img); }
  #hl .m-b { color:var(--md-b); }
  #hl .m-cm { color:var(--md-cm); }
  #hl .m-q { background:var(--md-q); border-radius:3px; }
  #hl .m-sug { background:var(--md-sug); border-radius:3px; }
  .legend { color:var(--muted); font-size:12px; }
  .legend i { font-style:normal; padding:0 4px; border-radius:3px; }
  #mirror { position:absolute; visibility:hidden; white-space:pre-wrap; overflow-wrap:break-word; padding:12px 14px; border:0;
            font:15px/1.7 "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  dialog { border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); padding:16px 18px; max-width:min(560px, 92vw); }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  dialog h2 { margin:0 0 8px; font-size:15px; }
  dialog textarea { width:100%; min-height:80px; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
  #thumb { max-width:100%; max-height:200px; border:1px solid var(--line); margin-bottom:8px; }
  #figlist { max-height:50vh; overflow:auto; margin:0; padding:0; list-style:none; }
  #figlist li { padding:6px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  #figlist li:hover { background:var(--bg); }
  #sugPanel { border-top:2px solid var(--line); max-height:38%; overflow:auto; background:var(--bg); }
  #sugPanel[hidden] { display:none; }
  .sug { padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); margin:6px; border-radius:6px; }
  .sug .tx { white-space:pre-wrap; overflow-wrap:break-word; line-height:1.7; }
  .sug .lbl { color:var(--muted); font-size:12px; margin-right:6px; }
  .sug del { background:rgba(229,72,77,.22); text-decoration:line-through; }
  .sug ins { background:rgba(46,155,95,.28); text-decoration:none; }
  .sug .sp { font-size:.8em; opacity:.75; }
  .sug ins, .sug del { padding:0 3px; border-radius:3px; font-weight:700; }  /* 마침표 하나도 잘 보이게 */
  .sug .hunk { cursor:pointer; border-radius:3px; }
  .sug .hunk.off del { background:none; text-decoration:none; font-weight:400; }
  .sug .hunk.off ins { background:none; text-decoration:line-through; opacity:.5; font-weight:400; outline:1px dashed var(--muted); }
  .sug .tip { color:var(--muted); font-size:12px; margin-left:6px; }
  .sug .flag { color:var(--low); font-weight:600; font-size:12px; margin-left:6px; }
  .sug .btns { margin-top:6px; display:flex; gap:6px; }
  .warn { color:var(--low); font-weight:600; }
  kbd { border:1px solid var(--line); border-radius:4px; padding:0 4px; font-size:12px; background:var(--bg); }
</style>
</head>
<body>
<header>
  <h1 id="title">전자책 OCR 교정</h1>
  <button id="prev" title="이전 쪽 (Alt+←)">◀</button>
  <input id="pageNo" type="number" min="1" value="1" title="쪽 번호">
  <span id="pageTotal">/ 0</span>
  <button id="next" title="다음 쪽 (Alt+→)">▶</button>
  <span class="sep"></span>
  <button id="toggleRows" class="on" title="이미지 위에 OCR이 읽은 줄 표시">줄 상자</button>
  <button id="nextLow" title="신뢰도가 낮은 다음 줄로 이동 (Alt+L)">다음 의심 줄</button>
  <span class="sep"></span>
  <button id="nextSug" title="AI 교정 제안이 남은 다음 쪽으로 이동 (Alt+S)" hidden>다음 제안 쪽</button>
  <button id="cropMode" title="이미지에서 영역을 끌어 그림으로 넣기 (Alt+G)">그림 넣기 모드</button>
  <button id="figs" title="넣은 그림 목록과 설명이 빠진 그림 점검">그림 목록</button>
  <span class="sep"></span>
  <button id="zoomOut" title="축소 (Ctrl+휠)">－</button><button id="zoomText" title="글이 있는 영역을 칸 폭에 맞춤 (기본)">글 맞춤</button><button id="zoomFit" title="쪽 전체를 칸 폭에 맞춤">쪽 전체</button><button id="zoomIn" title="확대 (Ctrl+휠)">＋</button>
  <span class="grow"></span>
  <span id="status">불러오는 중…</span>
  <button id="saveNow" title="바로 저장 (Ctrl+S)">저장</button>
</header>
<main>
  <section>
    <div class="bar"><span class="t" id="imgTitle">원본 이미지</span><span id="imgHint" style="color:var(--muted)"></span></div>
    <div id="imgwrap"><div id="stage"><img id="pageImg" alt="원본 쪽 이미지"><div id="overlay"></div><div id="sel" hidden></div></div></div>
  </section>
  <section>
    <div class="bar"><span class="t" id="edTitle">교정 글</span>
      <span class="legend">이 쪽 글만 보입니다 ·
        <i style="color:var(--md-h)">## 대</i><i style="color:var(--md-h2)">### 중</i><i style="color:var(--md-h3)">#### 소</i><i style="color:var(--md-quote)">&gt; 주</i><i style="color:var(--md-img)">![그림]</i><i style="background:var(--md-q)">[?]</i><i style="background:var(--md-sug)">AI 제안 있음</i></span>
      <span class="grow"></span>
      <input id="findText" type="text" placeholder="찾기" size="10"><input id="replText" type="text" placeholder="바꿀 글" size="10">
      <button id="findNext">찾기</button><button id="replAll">모두 바꾸기</button>
    </div>
    <div class="fmt">
      <button id="fB" title="굵게 (Ctrl+B) — 글을 고르고 누름"><b>굵게</b></button>
      <button id="fI" title="기울임 (Ctrl+I)"><i>기울임</i></button>
      <button id="fU" title="밑줄 (Ctrl+U)"><u>밑줄</u></button>
      <span class="sep"></span>
      <button id="fH1" title="커서가 있는 줄을 대주제(##)로">대주제</button>
      <button id="fH2" title="커서가 있는 줄을 중주제(###)로">중주제</button>
      <button id="fH3" title="커서가 있는 줄을 소주제(####)로">소주제</button>
      <button id="fP" title="커서가 있는 줄을 본문으로 (제목·주 표시 지움)">본문</button>
      <span class="sep"></span>
      <button id="fNote" title="고른 글을 본문에서 빼서 그 문단 아래 '> 주:'로 옮김. 고르지 않으면 커서 줄을 주로 바꿈 (Alt+N)">각주</button>
      <span class="sep"></span>
      <button id="fUp" title="커서가 있는 문단(그림 줄 등)을 한 문단 위로 (Alt+↑)">문단 ▲</button>
      <button id="fDown" title="커서가 있는 문단을 한 문단 아래로 (Alt+↓)">문단 ▼</button>
    </div>
    <div id="edwrap"><pre id="hl" aria-hidden="true"></pre><textarea id="editor" spellcheck="false"></textarea></div>
    <div id="sugPanel" hidden><div class="bar"><span class="t">AI 교정 제안</span><span id="sugInfo" style="color:var(--muted)"></span><span class="grow"></span><button id="acceptPage" title="이 쪽 제안을 모두 글에 반영">이 쪽 모두 수락</button><button id="rejectPage" title="이 쪽 제안을 모두 거절">이 쪽 모두 거절</button></div><div id="sugList"></div></div>
  </section>
</main>
<div id="mirror"></div>

<dialog id="figDlg">
  <h2>그림 넣기</h2>
  <img id="thumb" alt="">
  <div>이 그림을 글로 설명해 주세요. <b>AI용 텍스트에는 그림 대신 이 설명이 들어갑니다.</b></div>
  <textarea id="figAlt" placeholder="예: 3단계 학습 과정을 보여주는 순서도. 입력 → 처리 → 출력 순으로 화살표가 이어진다."></textarea>
  <div style="color:var(--muted);font-size:12px">비워 두면 &quot;설명 없음&quot;으로 표시되고, 내보낼 때 알려 드립니다.</div>
  <div class="row"><button id="figCancel">취소</button><button id="figOk" class="on">넣기</button></div>
</dialog>

<dialog id="figListDlg">
  <h2>그림 목록</h2>
  <div id="figSummary"></div>
  <ul id="figlist"></ul>
  <div class="row"><button id="figListClose">닫기</button></div>
</dialog>

<script>
"use strict";
const $ = id => document.getElementById(id);
const hl = $("hl"), ed = $("editor"), img = $("pageImg"), stage = $("stage"), overlay = $("overlay"), wrap = $("imgwrap"), sel = $("sel");
const MARK = /<!-- p\.(\d+) -->/g;
let book = null, page = 1, zoom = "text" /* "text" = 글 영역에 맞춤, 0 = 쪽 폭에 맞춤, 숫자 = 배율 */, rowsData = {}, showRows = true, cropOn = false;
let full = "", curFrom = -1, curTo = -1;  // full: 책 전체 글. 글 칸에는 full[curFrom:curTo] (지금 쪽)만 보인다
let suspects = [], suspectPos = -1, curRow = -1, pendingBox = null, dirty = false, saveTimer = null, saving = false;

function setStatus(t, err) { const s = $("status"); s.textContent = t; s.className = err ? "err" : ""; }
async function api(path, opt) {
  opt = opt || {};
  opt.headers = Object.assign({ "X-Ebook-Review": "1" }, opt.headers || {});
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

// ---- 쪽 ↔ 글 위치 -----------------------------------------------------
function markers() {
  const out = []; let m; MARK.lastIndex = 0;
  const t = full;
  while ((m = MARK.exec(t))) out.push({ no: +m[1], pos: m.index, end: m.index + m[0].length });
  return out;
}
function pageOfPos(c) {  // 책 전체 글의 위치 → 쪽 번호
  const ms = markers();
  let cur = null;
  for (const m of ms) { if (m.pos <= c) cur = m; else break; }
  return cur ? cur.no : (ms.length ? ms[0].no : 1);
}
function pageRange(no) {  // 그 쪽 글의 범위 (쪽 표시 줄 다음부터 다음 쪽 표시 앞까지). 글이 없는 쪽은 null
  const ms = markers(), i = ms.findIndex(m => m.no === no);
  if (i < 0) return ms.length ? null : { from: 0, to: full.length };
  let from = ms[i].end; if (full[from] === "\n") from++;
  let to = i + 1 < ms.length ? ms[i + 1].pos : full.length;
  while (to > from && full[to - 1] === "\n") to--;  // 끝 빈 줄은 밖에 두어 다음 쪽 표시가 늘 제 줄에 있게
  return { from, to };
}
function loadPageText(no, keepScroll) {
  const r = pageRange(no), top = ed.scrollTop;
  if (!r) { curFrom = curTo = -1; ed.value = ""; ed.readOnly = true; ed.placeholder = "이 쪽에는 글이 없습니다 (그림만 있는 쪽이거나 OCR이 글을 찾지 못한 쪽)"; }
  else { curFrom = r.from; curTo = r.to; ed.value = full.slice(r.from, r.to); ed.readOnly = false; ed.placeholder = ""; }
  $("edTitle").textContent = no + "쪽 글";
  if (!keepScroll) { ed.setSelectionRange(0, 0); ed.scrollTop = 0; } else ed.scrollTop = top;
  highlight();
}
function syncFull() {  // 글 칸에서 고친 것을 책 전체 글에 반영
  if (curFrom < 0) return;
  full = full.slice(0, curFrom) + ed.value + full.slice(curTo); curTo = curFrom + ed.value.length;
}
function gotoGlobal(k, len) {  // 책 전체 글의 위치로 이동 (필요하면 쪽을 넘김)
  const no = pageOfPos(k);
  if (no !== page) showPage(no, {});
  const a = k - curFrom; if (curFrom < 0 || a < 0 || a > ed.value.length) return;
  ed.focus({ preventScroll: true }); ed.setSelectionRange(a, a + (len || 0)); scrollEditorTo(a);
}

// ---- 마크다운 색칠 ------------------------------------------------------
const escH = x => x.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function hlInline(t) {
  return escH(t)
    .replace(/!\[([^\]]*)\]\(([^)]*)\)/g, '<span class="m-img">![<span class="m-alt">$1</span>]($2)</span>')
    .replace(/\*\*([^*]+)\*\*/g, '<span class="m-mk">**</span><span class="m-b">$1</span><span class="m-mk">**</span>')
    .replace(/(^|[^*\w])\*(?!\s)([^*\n]+?)\*(?![*\w])/g, '$1<span class="m-mk">*</span><span class="m-i">$2</span><span class="m-mk">*</span>')
    .replace(/&lt;u&gt;(.+?)&lt;\/u&gt;/g, '<span class="m-mk">&lt;u&gt;</span><span class="m-u">$1</span><span class="m-mk">&lt;/u&gt;</span>')
    .replace(/&lt;!--.*?--&gt;/g, m => '<span class="m-cm">' + m + "</span>")
    .replace(/\[\?\]/g, '<span class="m-q">[?]</span>');
}
function hlLine(line) {
  let m, out;
  if ((m = /^(#{1,6})(\s.*|)$/.exec(line))) out = '<span class="m-mk">' + m[1] + '</span><span class="' + (m[1].length >= 4 ? "m-h3" : m[1].length === 3 ? "m-h2" : "m-h") + '">' + hlInline(m[2]) + "</span>";
  else if ((m = /^(>\s?)(.*)$/.exec(line))) out = '<span class="m-quote"><span class="m-mk">' + escH(m[1]) + "</span>" + hlInline(m[2]) + "</span>";
  else if ((m = /^(\s*)([-*+]|\d+[.)])(\s.*)$/.exec(line))) out = escH(m[1]) + '<span class="m-mk">' + escH(m[2]) + "</span>" + hlInline(m[3]);
  else if (/^\s*(\*{3,}|-{3,}|_{3,})\s*$/.test(line)) out = '<span class="m-mk">' + escH(line) + "</span>";
  else out = hlInline(line);
  return line.trim() && sugMap.has(line.trim()) ? '<span class="m-sug">' + out + "</span>" : out;
}
function highlight() {
  hl.innerHTML = ed.value.split("\n").map(hlLine).join("\n") + "\n";
  hl.scrollTop = ed.scrollTop;
}
function scrollEditorTo(pos) {
  const mi = $("mirror");
  mi.style.width = ed.clientWidth + "px";
  mi.textContent = ed.value.slice(0, pos);
  const span = document.createElement("span"); span.textContent = "|"; mi.appendChild(span);
  ed.scrollTop = Math.max(0, span.offsetTop - ed.clientHeight / 3);
}
function focusPageText(no) {  // 글 칸에는 그 쪽 글만 있으므로 맨 위로
  ed.setSelectionRange(0, 0); ed.scrollTop = 0; hl.scrollTop = 0;
}

// ---- 이미지 -----------------------------------------------------------
function textBox() {  // 이 쪽에서 OCR 줄·그림이 있는 영역 (픽셀, 여백 포함). 없으면 null
  const d = rowsData[page]; if (!d) return null;
  const W = d.width || img.naturalWidth, H = d.height || img.naturalHeight;
  const bs = (d.rows || []).map(r => r.box).concat(d.pictures || []);
  if (!W || !H || !bs.length) return null;
  let x0 = Math.min(...bs.map(b => b[0])), y0 = Math.min(...bs.map(b => b[1]));

  const A = a.slice(pre, n - suf), B = b.slice(pre, m - suf), out = [];
  if (pre) out.push(["=", a.slice(0, pre)]);
  if (A.length * B.length > 4e6) { if (A) out.push(["-", A]); if (B) out.push(["+", B]); }
  else {
    const dp = Array.from({ length: A.length + 1 }, () => new Uint16Array(B.length + 1));
    for (let i = A.length - 1; i >= 0; i--) for (let j = B.length - 1; j >= 0; j--)
      dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    let i = 0, j = 0; const push = (k, c) => { if (out.length && out[out.length - 1][0] === k) out[out.length - 1][1] += c; else out.push([k, c]); };
    while (i < A.length && j < B.length) {
      if (A[i] === B[j]) { push("=", A[i]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) push("-", A[i++]); else push("+", B[j++]);
    }
    while (i < A.length) push("-", A[i++]); while (j < B.length) push("+", B[j++]);
  }
  if (suf) out.push(["=", a.slice(n - suf)]);
  return out;
}
function paragraphsOfPage(no) {  // 그 쪽의 문단(줄) 목록
  const r = pageRange(no); if (!r) return [];
  return full.slice(r.from, r.to).split("\n").map(x => x.trim()).filter(Boolean);
}
function sugPages() {  // 제안이 남은 쪽 번호들
  return markers().map(m => m.no).filter(no => paragraphsOfPage(no).some(t => sugMap.has(t)));
}
function renderSuggestions() {
  const panel = $("sugPanel"), list = $("sugList");
  highlight();
  if (!sugMap.size) { panel.hidden = true; $("nextSug").hidden = true; return; }
  const pages = sugPages();
  $("nextSug").hidden = false; $("nextSug").textContent = "다음 제안 쪽 (" + pages.length + "쪽 남음)";
  const here = [...new Set(paragraphsOfPage(page).filter(t => sugMap.has(t)))];
  panel.hidden = false; list.innerHTML = "";
  $("acceptPage").hidden = $("rejectPage").hidden = !here.length;
  $("sugInfo").textContent = here.length ? "이 쪽 " + here.length + "건 · 남은 제안 " + sugMap.size + "건 (원문은 수락 전까지 그대로입니다)"
    : "이 쪽에는 제안이 없습니다 · 남은 제안 " + sugMap.size + "건 → '다음 제안 쪽'";
  for (const orig of here) {
    const s = sugMap.get(orig), card = document.createElement("div"); card.className = "sug";
    const diff = lcsDiff(orig, s.sug); const esc = x => x.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const vis = x => esc(x).replace(/ /g, '<span class="sp">␣</span>');  // 빠지거나 더해진 띄어쓰기를 보이게
    // 고친 곳(바뀐 글자가 이어진 덩어리)마다 번호를 매겨, 눌러서 넣거나 뺄 수 있게
    const hunkOf = []; let hn = -1, prev = "=";
    diff.forEach(([k], i) => { if (k !== "=" && prev === "=") hn++; hunkOf[i] = k === "=" ? -1 : hn; prev = k; });
    const nH = hn + 1, on = new Array(nH).fill(true);
    const row = side => diff.map(([k, c], i) => k === "=" ? esc(c) : k === side
      ? '<span class="hunk" data-h="' + hunkOf[i] + '" title="눌러서 이 고친 곳을 넣거나 빼기">' + (k === "-" ? "<del>" : "<ins>") + vis(c) + (k === "-" ? "</del>" : "</ins>") + "</span>" : "").join("");
    card.innerHTML = '<div class="tx"><span class="lbl">원문</span>' + row("-") + '</div><div class="tx"><span class="lbl">제안</span>' + row("+") +
      (s.flags.length ? '<span class="flag">⚠ ' + s.flags.join(", ") + " — 원본과 꼭 대조하세요</span>" : "") + '</div><div class="btns"></div>';
    const acc = document.createElement("button"); acc.className = "on";
    const rej = document.createElement("button"); rej.textContent = "거절";
    const tip = document.createElement("span"); tip.className = "tip";
    const built = () => diff.map(([k, c], i) => k === "=" ? c : (on[hunkOf[i]] ? (k === "+" ? c : "") : (k === "-" ? c : ""))).join("");
    const refresh = () => {
      const n = on.filter(Boolean).length;
      acc.textContent = n === nH ? "수락" : "고른 " + n + "곳만 수락"; acc.disabled = n === 0;
      tip.textContent = nH > 1 ? "고친 곳 " + nH + "곳 · 바뀐 글자를 누르면 넣거나 뺄 수 있습니다" : "";
      card.querySelectorAll(".hunk").forEach(e => e.classList.toggle("off", !on[+e.dataset.h]));
    };
    card.querySelectorAll(".hunk").forEach(e => e.addEventListener("click", ev => { ev.stopPropagation(); on[+e.dataset.h] = !on[+e.dataset.h]; refresh(); }));
    acc.onclick = () => acceptSug(orig, false, built()); rej.onclick = () => resolveSug(orig, "rejected");
    card.querySelector(".btns").append(acc, rej, tip); list.appendChild(card); refresh();
    card.querySelector(".tx").style.cursor = "pointer"; card.querySelector(".tx").title = "누르면 글 칸에서 이 문단을 표시합니다";
    card.querySelector(".tx").onclick = () => { const k = ed.value.indexOf(orig); if (k >= 0) { ed.focus({ preventScroll: true }); ed.setSelectionRange(k, k + orig.length); scrollEditorTo(k); } };
  }
}
async function resolveSug(orig, status) {
  try { await api("/api/suggest/status", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ orig, status }) }); }
  catch (e) { setStatus("제안 상태 저장 실패: " + e.message, true); return; }
  sugMap.delete(orig); renderSuggestions();
}
async function acceptSug(orig, quiet, text) {  // text: 고친 곳 일부만 고른 경우의 결과 글 (없으면 제안 전체)
  const s = sugMap.get(orig); if (!s) return false;
  const v = ed.value, k = v.indexOf(orig);
  if (k < 0) { setStatus("원문이 이미 바뀌어 적용하지 못했습니다 (제안을 거절 처리하세요)", true); return false; }
  const top = ed.scrollTop;
  ed.value = v.slice(0, k) + (text === undefined ? s.sug : text) + v.slice(k + orig.length); ed.scrollTop = top;
  onEdited(); await resolveSug(orig, "accepted"); if (!quiet) setStatus("제안을 반영했습니다");
  return true;
}
async function resolvePage(accept) {
  const here = [...new Set(paragraphsOfPage(page).filter(t => sugMap.has(t)))];
  if (!here.length) return;
  if (!confirm("이 쪽 제안 " + here.length + "건을 모두 " + (accept ? "수락" : "거절") + "할까요?")) return;
  let n = 0;
  for (const orig of here) { if (accept ? await acceptSug(orig, true) : (await resolveSug(orig, "rejected"), true)) n++; }
  setStatus("이 쪽 제안 " + n + "건을 " + (accept ? "반영했습니다" : "거절했습니다"));
}
$("acceptPage").onclick = () => resolvePage(true);
$("rejectPage").onclick = () => resolvePage(false);
$("nextSug").onclick = () => {
  const pages = sugPages();
  if (!pages.length) { setStatus("남은 제안이 없습니다"); return; }
  const nx = pages.find(no => no > page) || pages[0];
  showPage(nx, {}); setStatus(nx === page && pages.length === 1 ? "제안이 남은 쪽은 이 쪽뿐입니다" : nx + "쪽 제안");
};
async function loadSuggestions() {
  try { const l = await api("/api/suggestions"); sugMap = new Map(l.map(x => [x.orig, x])); } catch (e) { sugMap = new Map(); }
  renderSuggestions();
}

// ---- 단축키 ------------------------------------------------------------
window.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); dirty = true; save(); return; }
  if ((e.ctrlKey || e.metaKey) && document.activeElement === ed && !e.shiftKey && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === "b") { e.preventDefault(); return $("fB").click(); }
    if (k === "i") { e.preventDefault(); return $("fI").click(); }
    if (k === "u") { e.preventDefault(); return $("fU").click(); }
  }
  if (e.altKey && document.activeElement === ed && e.key === "ArrowUp") { e.preventDefault(); return moveBlock(-1); }
  if (e.altKey && document.activeElement === ed && e.key === "ArrowDown") { e.preventDefault(); return moveBlock(1); }
  if (e.altKey && e.key.toLowerCase() === "n") { e.preventDefault(); return makeNote(); }
  if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); $("prev").click(); }
  else if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); $("next").click(); }
  else if (e.altKey && e.key.toLowerCase() === "l") { e.preventDefault(); $("nextLow").click(); }
  else if (e.altKey && e.key.toLowerCase() === "s") { e.preventDefault(); $("nextSug").click(); }
  else if (e.altKey && e.key.toLowerCase() === "g") { e.preventDefault(); $("cropMode").click(); }
});

// ---- 시작 --------------------------------------------------------------
(async function init() {
  try {
    book = await api("/api/book");
    document.title = book.title + " — 교정";
    $("title").textContent = book.title;
    full = book.md.replace(/\r\n/g, "\n"); dirty = false;
    suspects = await api("/api/suspects");
    await loadSuggestions();
    $("nextLow").textContent = "다음 의심 줄 (" + suspects.length + ")";
    applyZoom();
    page = 0; await showPage(markers().length ? markers()[0].no : 1, {});
    setStatus("준비됨");
  } catch (e) { setStatus("불러오기 실패: " + e.message, true); }
})();
</script>
